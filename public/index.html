<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポケットTV</title>
<meta name="description" content="公式配信（NHK ONE・TVer）をスマホから一発で開く、自分用のテレビ。">
<meta name="theme-color" content="#111317">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1 class="name">ポケット<span>TV</span></h1>
  <div class="clock" id="clock" aria-live="off">--:--</div>
</header>

<main>
  <section aria-labelledby="h-nhk">
    <h2 id="h-nhk" class="sec">NHK <small>NHK ONE で同時配信</small></h2>
    <div id="nhk" class="list"></div>
  </section>

  <section aria-labelledby="h-tver">
    <h2 id="h-tver" class="sec">民放 <small>TVer リアルタイム。東京の放送・夜が中心で、配信がない時間は TVer 側に案内が出ます</small></h2>
    <div id="tver" class="list"></div>
  </section>
</main>

<footer class="foot">
  <p id="status" class="status"></p>
  <p>NHK番組の情報提供：NHK</p>
  <p>映像はすべて各公式サービスで再生されます。</p>
</footer>

<template id="tpl-card">
  <article class="card">
    <div class="card-head">
      <span class="ch"></span>
      <span class="aff"></span>
    </div>
    <button class="now" type="button" aria-expanded="false">
      <span class="now-time"></span>
      <span class="now-title"></span>
      <span class="now-sub"></span>
      <span class="bar" aria-hidden="true"><i></i></span>
      <span class="next"></span>
    </button>
    <ol class="sched" hidden></ol>
    <a class="watch" target="_blank" rel="noopener noreferrer">見る<span aria-hidden="true"> ▸</span></a>
  </article>
</template>

<script src="/app.js" type="module"></script>
</body>
</html>
